swagger: '2.0'
info:
  description: >-
    Cette API vous permet de consulter les données quotidiennes de comptage du soutirage (consommation d’électricité) et d'injection (production d’électricité), sur le réseau général de distribution d’électricité, des compteurs communicants pour lesquels le titulaire a autorisé votre entité à consulter ses données. La réponse de ce service est instantanée. Seule l’autorisation donnée par le titulaire à partir de son compte client permet l'accès à cette ressource.
    Les données mesurées disponibles sont :
      •	La consommation et/ou la production quotidienne
      •	La courbe de charge de consommation et/ou de production
      •	Les données d'index de consommation et/ou de production
      •	La puissance maximum de consommation
    Le nombre maximum de requêtes est de 5 appels par secondes et/ou 1000 appels par heure.
  version: v2
  title: mesure_autorisee
host: gw.ext.prod.api.enedis.fr
basePath: /mesure_synchrone_auto/v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
security:
  - default: []
paths:
  /index_consommation:
    get:
      tags:
        - Metering Data
      summary: Accès aux données d'index.
      parameters:
        - name: Content-Type
          in: header
          description: >-
            Format du body de la requête. Ce header est déterminé automatiquement lorsqu'un body est renseigné dans la requête de l'appel API.
          required: false
          type: string
          x-example: application/json;charset=UTF-8
        - name: Accept
          in: header
          description: >-
            Format de réponse acceptable. Ce header est déterminé automatiquement lorsque vous renseignez l'url de l'API.
          required: false
          type: string
          x-example: application/json
        - name: Authorization
          in: header
          description: >-
            Bearer Token généré par l'api Authentification à renseigner.
          required: true
          type: string
          x-example: Bearer HPt7dXk6OBY4aoeyqbIvOM6
        - name: User-Agent
          in: header
          description: >-
            Description de l'équipement qui a émis la requêtes
            (hardware/software). Ce header est déterminé automatiquement lorsque vous renseignez l'url de l'API.
          required: false
          type: string
          x-example: Mozilla/5.0 (Linux; U; Android 4.0.3; fr-fr; LG-L160L Build/IML74K)
        - name: Host
          in: header
          description: >-
            Nom de domaine du serveur. Ce header est déterminé automatiquement lorsque vous renseignez l'url de l'API. Attention, si le port :443 apparait dans l'url, veuillez le supprimer pour que l'appel API soit fonctionnel.
          required: true
          type: string
          x-example: 'gw.ext.prod.api.enedis.fr'
        - name: pointId
          in: query
          description: Identifiant du point de livraison (PRM)
          required: true
          type: string
          x-example: '99999999999999'
        - name: dateDebut
          in: query
          description: >-
            Jour de début de la plage demandée au format full-date de la RFC
            3339, à savoir YYYY-MM-DD. Les données retournées inclueront la date
            de démarrage.
          required: true
          type: string
          x-example: '2025-05-01'
        - name: dateFin
          in: query
          description: >-
            Jour de fin de la plage demandée au format full-date de la RFC 3339,
            à savoir YYYY-MM-DD. Les données retournées n'inclueront pas la date
            de fin et s'arrêteront la veille.
          required: true
          type: string
          x-example: '2025-05-06'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ReponseMesureAccesIndex'
        '400':
          description: La syntaxe de la requête est erronée.
          schema:
            type: object
            properties:
              code:
                type: string
                description: Code de l’erreur retourné par le système.
              message:
                type: string
                example: Le paramètre usage_point_id est obligatoire
        '403':
          description: Erreur dans le format de la requête
          schema:
            type: object
            properties:
              code:
                type: string
                description: Code de l’erreur retourné par le système.
              message:
                type: string
                example: Le client n'est pas titulaire du point demandé
        '404':
          description: Ressource non trouvée.
          schema:
            type: object
            properties:
              code:
                type: string
                description: Service non disponible.
              message:
                type: string
                example: Pas de mesure trouvée pour ce point
        '429':
          description: L’application a dépassé son quota d’appels
          schema:
            type: object
            properties:
              code:
                type: string
                description: SLA dépassé.
              message:
                type: string
                example: SLA dépassé
        '500':
          description: Erreur interne de serveur.
          schema:
            type: object
            properties:
              code:
                type: string
                description: Code de l’erreur retourné par le système.
              message:
                type: string
                example: Problème technique dans l'interrogation du SI coeur
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
          - oauth2
        optional: false

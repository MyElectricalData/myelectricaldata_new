        - name: Authorization
          in: header
          description: >-
            Bearer Token généré par l'api Authentification à renseigner.
          required: true
          type: string
          x-example: Bearer HPt7dXk6OBY4aoeyqbIvOM6
        - name: User-Agent
          in: header
          description: >-
            Description de l'équipement qui a émis la requêtes
            (hardware/software). Ce header est déterminé automatiquement lorsque vous renseignez l'url de l'API.
          required: false
          type: string
          x-example: Mozilla/5.0 (Linux; U; Android 4.0.3; fr-fr; LG-L160L Build/IML74K)
        - name: Host
          in: header
          description: >-
            Nom de domaine du serveur. Ce header est déterminé automatiquement lorsque vous renseignez l'url de l'API. Attention, si le port :443 apparait dans l'url, veuillez le supprimer pour que l'appel API soit fonctionnel.
          required: true
          type: string
          x-example: 'gw.ext.prod.api.enedis.fr'
        - name: pointId
          in: query
          description: Identifiant du point de livraison (PRM)
          required: true
          type: string
          x-example: '99999999999999'
        - name: dateDebut
          in: query
          description: >-
            Jour de début de la plage demandée au format full-date de la RFC
            3339, à savoir YYYY-MM-DD. Les données retournées inclueront la date
            de démarrage.
          required: true
          type: string
          x-example: '2025-05-01'
        - name: dateFin
          in: query
          description: >-
            Jour de fin de la plage demandée au format full-date de la RFC 3339,
            à savoir YYYY-MM-DD. Les données retournées n'inclueront pas la date
            de fin et s'arrêteront la veille.
          required: true
          type: string
          x-example: '2025-05-06'
        - name: mesuresPas
          in: query
          description: >-
            Pas de mesure renseigné pour les données de mesure de type PMAX. Le
            pas peut être quotidien (P1D) ou mensuel (P1M)
          required: true
          type: string
          enum:
            - 'P1D'
            - 'P1M'
          x-example: P1D
        - name: grandeurPhysique
          in: query
          description: >-
            Sélectionner pour le champ grandeurPhysique, la valeur :<br>-PMA
            pour ne récupérer que la Puissance Maximale « équivalent monophasé
            »<br>-TOUT pour récupérer sur la base d'un PRM triphasé le détail de l'ensemble des phases et la Puissance Maximale "équivalent monophasé"
          required: true
          type: string
          enum:
            - PMA
            - TOUT
          x-example: PMA
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ReponseMesureAccesMaxQuotidien'
        '400':
          description: La syntaxe de la requête est erronée.
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
                example: Le paramètre usage_point_id est obligatoire
        '403':
          description: Erreur dans le format de la requête
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
                example: Le client n'est pas titulaire du point demandé
        '404':
          description: Ressource non trouvée.
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
                example: Pas de mesure trouvée pour ce point
        '429':
          description: L’application a dépassé son quota d’appels

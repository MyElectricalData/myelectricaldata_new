definitions:
  ReponseMesureAccesCDC:
    type: object
    required:
      - idPrm
      - etapeMetier
      - periode
      - modeCalcul
      - grandeur
    properties:
      idPrm:
        type: string
        description: Identifiant du point de livraison (PRM)
      etapeMetier:
        type: string
        description: BRUT si la mesure est brute, BEST si la mesure est corrigée
      periode:
        $ref: '#/definitions/Periode'
      modeCalcul:
        type: string
        description: |-
          Mode de calcul de la valeur. Dépend du type de mesure:
          Pour les CDC: MESURE
          Pour les ENERGIE: DIFF.INDEX si les énergies sont calculées à partir des index, INTEG.COURBE si les énergies sont calculées à partir de la courbe de charge
          Pour les INDEX: non renseigné
          Pour les PMAX: MESURE
      grandeur:
        type: array
        items:
          $ref: '#/definitions/GrandeurCDC'
      contexte:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
  ReponseMesureAccesQuotidien:
    type: object
    required:
      - idPrm
      - etapeMetier
      - periode
      - modeCalcul
      - grandeur
    properties:
      idPrm:
        type: string
        description: Identifiant du point de livraison (PRM)
      etapeMetier:
        type: string
        description: BRUT si la mesure est brute, BEST si la mesure est corrigée
      periode:
        $ref: '#/definitions/Periode'
      typeValeur:
        type: string
      modeCalcul:
        type: string
        description: |-
          Mode de calcul de la valeur. Dépend du type de mesure:
          Pour les CDC: MESURE
          Pour les ENERGIE: DIFF.INDEX si les énergies sont calculées à partir des index, INTEG.COURBE si les énergies sont calculées à partir de la courbe de charge
          Pour les INDEX: non renseigné
          Pour les PMAX: MESURE
      pas:
        type: string
        description: |-
          Pas de la mesure. Dépend du type de mesure:
          Pour les CDC: PT5M, PT10M, PT30M, PT60M
          Pour les ENERGIE: P1D
          Pour les INDEX: non renvoyé
          Pour les PMAX: P1D, P1M
      grandeur:
        type: array
        items:
          $ref: '#/definitions/GrandeurQuotidien'
      contexte:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
  ReponseMesureAccesMaxQuotidien:
    type: object
    required:
      - idPrm
      - etapeMetier
      - periode
      - modeCalcul
      - grandeur
    properties:
      idPrm:
        type: string
        description: Identifiant du point de livraison (PRM)
      etapeMetier:
        type: string
        description: BRUT si la mesure est brute, BEST si la mesure est corrigée
      periode:
        $ref: '#/definitions/Periode'
      modeCalcul:
        type: string
        description: |-
          Mode de calcul de la valeur. Dépend du type de mesure:
          Pour les CDC: MESURE
          Pour les ENERGIE: DIFF.INDEX si les énergies sont calculées à partir des index, INTEG.COURBE si les énergies sont calculées à partir de la courbe de charge
          Pour les INDEX: non renseigné
          Pour les PMAX: MESURE
      pas:
        type: string
        description: |-
          Pas de la mesure. Dépend du type de mesure:
          Pour les CDC: PT5M, PT10M, PT30M, PT60M
          Pour les ENERGIE: P1D
          Pour les INDEX: non renvoyé
          Pour les PMAX: P1D, P1M
      grandeur:
        type: array
        items:
          $ref: '#/definitions/GrandeurQuotidien'
      contexte:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
  ReponseMesureAccesIndex:
    type: object
    required:
      - idPrm
      - periode
      - grandeur
    properties:
      idPrm:
        type: string
        description: Identifiant du point de livraison (PRM)
      periode:
        $ref: '#/definitions/Periode'
      grandeur:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
      contexte:
        type: array
        items:
          $ref: '#/definitions/ContexteIndex'
  Periode:
    type: object
    properties:
      dateDebut:
        type: string
      dateFin:
        type: string
  GrandeurCDC:
    type: object
    required:
      - grandeurMetier
      - grandeurPhysique
      - unite
      - points
    properties:
      grandeurMetier:
        type: string
        description: CONS pour les données de consommation, PROD pour les données de production
      grandeurPhysique:
        type: string
        description: grandeur physique de la mesure, reprend les mêmes valeurs possibles que les grandeurs physiques en entrée
      unite:
        type: string
        description: unité de la mesure
      points:
        type: array
        items:
          $ref: '#/definitions/PointCDC'
      calendrier:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
  GrandeurQuotidien:
    type: object
    required:
      - grandeurMetier
      - grandeurPhysique
      - unite
      - points
    properties:
      grandeurMetier:
        type: string
        description: CONS pour les données de consommation, PROD pour les données de production
      grandeurPhysique:
        type: string
        description: grandeur physique de la mesure, reprend les mêmes valeurs possibles que les grandeurs physiques en entrée
      unite:
        type: string
        description: unité de la mesure
      points:
        type: array
        items:
          $ref: '#/definitions/PointQuotidien'
      calendrier:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
  GrandeurIndex:
    type: object
    required:
      - grandeurMetier
      - grandeurPhysique
      - unite
      - points
    properties:
      grandeurMetier:
        type: string
        description: CONS pour les données de consommation, PROD pour les données de production
      grandeurPhysique:
        type: string
        description: grandeur physique de la mesure, reprend les mêmes valeurs possibles que les grandeurs physiques en entrée
      unite:
        type: string
        description: unité de la mesure
      points:
        type: array
        description: un tableau vide est renvoyé pour ce cas
        items:
          type: object
        example: []
      calendrier:
        type: array
        items:
          $ref: '#/definitions/Calendrier'
      cadranTotalisateur:
        $ref: '#/definitions/ClasseTemporelleTotalisateur'
  ContexteIndex:
    type: object
    properties:
      etapeMetier:
        type: string
        description: BRUT si la mesure est brute, BEST si la mesure est corrigée
      contexteReleve:
        type: string
        description: Remonté dans le cas des consultation d'INDEX. COL → COLlecte,TOP → TéléOPération,FMR →Flux de Mesures Régulier,CRD →Compte-Rendu de Demande ponctuelle,CRI → Compte-Rendu d'Intervention
      typeReleve:
        type: string
        description: 'Remonté dans le cas des consultations d''INDEX. Valeurs possibles: AP, AQ, AS, AV, LC, RM, RC'
      grandeur:
        type: array
        items:
          $ref: '#/definitions/GrandeurIndex'
  PointCDC:
    type: object
    description: Détail des attributs des points de mesure
    required:
      - v
      - d
    properties:
      v:
        type: string
        description: Valeur du point
      d:
        type: string
        description: Horodate du point
      p:
        type: string
        description: Valeur du pas
      n:
        type: string
        description: Nature du point
      iv:
        type: string
        description: Indice de vraisemblance Linky
      ec:
        type: string
        description: Etat complémentaire
  PointQuotidien:
    type: object
    description: Détail des attributs des points de mesure
    required:
      - v
      - d
    properties:
      v:
        type: string
        description: Valeur du point
      d:
        type: string
        description: Horodate du point
  ClasseTemporelleTotalisateur:
    type: object
    description: Remonté dans le cas des consultations d'INDEX si, durant la période demandée, au moins un index totalisateur est présent.
    properties:
      codeCadran:
        type: string
        description: Code du cadran
      valeur:
        type: array
        items:
          $ref: '#/definitions/Valeur'
  Calendrier:
    type: object
    description: Remonté dans le cas des consultations d'INDEX si, durant la période demandée, auun calendrier fournisseur et/ou distributeur, avec des données d'Index, est présent.
    properties:
      idCalendrier:
        type: string
        description: Identifiant du calendrier fournisseur
      libelleCalendrier:
        type: string
        description: Libellé du calendrier fournisseur
      classeTemporelle:
        type: array
        items:
          $ref: '#/definitions/ClasseTemporelle'
  Valeur:
    type: object
    description: Contient le détail de la valeur des mesures d'index
    properties:
      d:
        type: string
        description: Horodate fonctionnelle de l'index
      v:
        type: integer
        description: Valeur de l'Index
        format: int64
      iv:
        type: integer
        description: Indice de vraisemblance de l'Index
        format: int64
  ClasseTemporelle:
    type: object
    properties:
      idClasseTemporelle:
        type: string
        description: Identifiant de la classe temporelle
      libelleClasseTemporelle:
        type: string
        description: Libellé de la classe temporelle
      codeCadran:
        type: string
        description: Code du cadran
      valeur:
        type: array
        items:
          $ref: '#/definitions/Valeur'
  Erreur:
    type: array
    items:
      type: object
      properties:
        code:
          type: string
        message:
          type: string


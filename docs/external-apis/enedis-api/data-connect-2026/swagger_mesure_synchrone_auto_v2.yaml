  /puissance_conso_max_quotidienne:
    get:
      tags:
        - Metering Data
      summary: Récupérer la puissance maximale de consommation atteinte quotidiennement
      description: >-
        Cette sous ressource renvoie les valeurs correspondant à des puissances
        maximales de consommation (en W) atteintes quotidiennement pour chaque
        jour de la période demandée. Chaque valeur est datée. La courbe de
        charge s'obtient sur des journées complètes de minuit à minuit du jour
        suivant en heures locales.  Un appel peut porter sur des données datant
        au maximum de 36 mois et 15 jours avant la date d'appel.
      parameters:
        - name: Content-Type
          in: header
          description: >-
            Format du body de la requête. Ce header est déterminé automatiquement lorsqu'un body est renseigné dans la requête de l'appel API.
          required: false
          type: string
          x-example: application/json;charset=UTF-8
        - name: Accept
          in: header
          description: >-
            Format de réponse acceptable. Ce header est déterminé automatiquement lorsque vous renseignez l'url de l'API.

            properties:
              code:
                type: string
              message:
                type: string
                example: Problème technique dans l'interrogation du SI coeur
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
          - oauth2
        optional: false
  /courbe_de_charge_consommation:
    get:
      tags:
        - Metering Data
      summary: >-
        Récupérer la puissance moyenne consommée quotidiennement, sur
        l'intervalle de mesure du compteur (par défaut 30 min)
      description: >-
        Cette sous ressource renvoie les valeurs correspondant à des journées de
        mesure de la courbe de charge de consommation d'un client pour chaque
        jour de la période demandée. Les valeurs retournées sont des puissances
        moyennes de consommation sur l'intervalle de mesure du compteur (par
        défaut 30 minutes). Chaque valeur est horodatée. La courbe de charge
        s'obtient sur des journées complètes de minuit à minuit du jour suivant
        en heures locales. Un appel peut porter au maximum sur 7 jours
        consécutifs.  Un appel peut porter sur des données datant au maximum de
        24 mois et 15 jours avant la date d'appel.
      parameters:
        - name: Content-Type
          in: header
          description: >-
            Format du body de la requête. Ce header est déterminé automatiquement lorsqu'un body est renseigné dans la requête de l'appel API.
          required: false
          type: string
          x-example: application/json;charset=UTF-8
        - name: Accept
          in: header
          description: >-
